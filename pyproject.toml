[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webshield"
version = "0.1.0"
description = "Local policy compiler and controlled server-hardening activation helper"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
webshield-activate = "webshield.privileged:main"

[tool.setuptools.packages.find]
where = ["src"]
